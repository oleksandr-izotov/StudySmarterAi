{% load i18n %}
{% if prompts %}
<div class="space-y-2">
    {% for prompt in prompts %}
    <div class="group relative bg-white border border-gray-100 hover:border-indigo-200 rounded-xl p-3 transition-all hover:shadow-sm cursor-pointer"
        hx-get="{% url 'prompt_detail' prompt.id %}" hx-target="#results-section" hx-swap="innerHTML"
        @click="toggleHistory(); $dispatch('show-results');"> <!-- Close drawer and hide hero -->

        <div class="flex justify-between items-start mb-1">
            <h4
                class="font-medium text-gray-800 text-sm line-clamp-2 leading-tight group-hover:text-indigo-600 transition-colors">
                {{ prompt.text }}
            </h4>
            <span class="text-[10px] text-gray-400 whitespace-nowrap ml-2 flex-shrink-0">
                {{ prompt.created_at|date:"d M" }}
            </span>
        </div>

        <div class="flex items-center gap-2 mt-2">
            <span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-[10px] rounded-md border border-gray-100">
                {{ prompt.get_goal_display }}
            </span>
            <!-- Optional: Delete button could go here with stop propagation -->
        </div>
    </div>
    {% endfor %}
</div>

<div class="mt-4 pt-3 border-t border-gray-100">
    <button
        class="w-full py-2 text-xs text-red-500 hover:bg-red-50 rounded-lg transition-colors flex items-center justify-center gap-2"
        @click="deleteModalOpen = true">
        <i data-lucide="trash-2" class="w-3 h-3"></i>
        {% trans "Очистить историю" %}
    </button>
</div>

<!-- Optional: Pagination Link could go here -->

{% else %}
<div class="text-center py-10">
    <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3">
        <i data-lucide="history" class="w-6 h-6 text-gray-300"></i>
    </div>
    <p class="text-gray-400 text-sm">История пока пуста</p>
</div>
{% endif %}
