{% load i18n %}
{% if prompts %}
<div>
    {% for prompt in prompts %}
    <div class="hist-item"
        hx-get="{% url 'prompt_detail' prompt.id %}" hx-target="#results-section" hx-swap="innerHTML"
        @click="toggleHistory(); $dispatch('show-results');">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
            <p class="ht">{{ prompt.text }}</p>
            <span class="hm" style="white-space: nowrap; flex-shrink: 0">{{ prompt.created_at|date:"d M" }}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
            <span class="hm" style="background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 1px 8px">{{ prompt.get_goal_display }}</span>
        </div>
    </div>
    {% endfor %}
</div>

<div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line)">
    <button class="menu-item" style="width: 100%; justify-content: center; color: var(--danger)" @click="deleteModalOpen = true">
        <i data-lucide="trash-2" class="w-[14px] h-[14px]"></i>
        {% trans "Очистить историю" %}
    </button>
</div>

{% else %}
<div style="text-align: center; padding: 48px 0">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 14px">
        <i data-lucide="history" class="w-6 h-6" style="color: var(--text-3)"></i>
    </div>
    <p style="color: var(--text-3); font-size: 14px">{% trans "История пока пуста" %}</p>
</div>
{% endif %}
