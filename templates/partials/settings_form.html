{% load settings_filters i18n %}

<form method="post" action="{% url 'settings:index' %}" hx-post="{% url 'settings:index' %}"
    hx-swap="outerHTML" x-data="{
        language: '{{ settings.language|default:'ru' }}',
        tone: '{{ settings.tone|default:'friendly' }}',
        depth: '{{ settings.depth|default:'detailed' }}'
    }" x-init="lucide.createIcons()">
    {% csrf_token %}

    <!-- Language -->
    <div class="set-group">
        <h3 class="set-title"><span class="icon"><i data-lucide="languages" class="w-[19px] h-[19px]"></i></span>{% trans "Язык ответов" %}</h3>
        <div class="set-grid" style="grid-template-columns: repeat(3, 1fr)">
            <label :class="language === 'ru' ? 'opt on' : 'opt'">
                <input type="radio" name="language" value="ru" class="sr-only" x-model="language" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-name">{% trans "Русский" %}</span>
                <span class="opt-sub">Russian</span>
            </label>
            <label :class="language === 'en' ? 'opt on' : 'opt'">
                <input type="radio" name="language" value="en" class="sr-only" x-model="language" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-name">English</span>
                <span class="opt-sub">{% trans "Английский" %}</span>
            </label>
            <label :class="language === 'de' ? 'opt on' : 'opt'">
                <input type="radio" name="language" value="de" class="sr-only" x-model="language" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-name">Deutsch</span>
                <span class="opt-sub">{% trans "Немецкий" %}</span>
            </label>
        </div>
    </div>

    <!-- Tone -->
    <div class="set-group">
        <h3 class="set-title"><span class="icon"><i data-lucide="message-circle" class="w-[19px] h-[19px]"></i></span>{% trans "Тон повествования" %}</h3>
        <div class="set-grid" style="grid-template-columns: repeat(2, 1fr)">
            <label :class="tone === 'friendly' ? 'opt on' : 'opt'">
                <input type="radio" name="tone" value="friendly" class="sr-only" x-model="tone" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-ic"><i data-lucide="smile" class="w-[19px] h-[19px]"></i></span>
                <span class="opt-name">{% trans "Дружелюбный" %}</span>
                <span class="opt-sub">{% trans "Понятный и легкий" %}</span>
            </label>
            <label :class="tone === 'strict' ? 'opt on' : 'opt'">
                <input type="radio" name="tone" value="strict" class="sr-only" x-model="tone" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-ic"><i data-lucide="graduation-cap" class="w-[19px] h-[19px]"></i></span>
                <span class="opt-name">{% trans "Академический" %}</span>
                <span class="opt-sub">{% trans "Точный и строгий" %}</span>
            </label>
        </div>
    </div>

    <!-- Depth -->
    <div class="set-group">
        <h3 class="set-title"><span class="icon"><i data-lucide="layers" class="w-[19px] h-[19px]"></i></span>{% trans "Глубина ответа" %}</h3>
        <div class="set-grid" style="grid-template-columns: repeat(2, 1fr)">
            <label :class="depth === 'short' ? 'opt on' : 'opt'">
                <input type="radio" name="depth" value="short" class="sr-only" x-model="depth" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-name">{% trans "Кратко" %}</span>
                <span class="opt-sub">{% trans "Только суть" %}</span>
            </label>
            <label :class="depth === 'detailed' ? 'opt on' : 'opt'">
                <input type="radio" name="depth" value="detailed" class="sr-only" x-model="depth" style="position:absolute;opacity:0">
                <span class="chk"><i data-lucide="check-circle-2" class="w-[18px] h-[18px]"></i></span>
                <span class="opt-name">{% trans "Подробно" %}</span>
                <span class="opt-sub">{% trans "С примерами и объяснениями" %}</span>
            </label>
        </div>
    </div>

    <!-- Save Button -->
    <div style="display: flex; justify-content: flex-end; padding-top: 6px">
        <button type="submit" class="btn btn-primary">{% trans "Сохранить настройки" %}</button>
    </div>

    {% if messages %}
    <div x-data x-init="{% for message in messages %}appData().showToast('{{ message }}', '{{ message.tags }}');{% endfor %}"></div>
    {% endif %}

</form>
