{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
    <div class="p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">{% trans "Вход по ссылке" %}</h2>
        <p class="text-gray-500 text-center mb-6 text-sm">{% trans "Мы отправим вам одноразовую ссылку для входа на почту." %}</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email"
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all"
                    required>
            </div>

            <button type="submit"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md mt-6">{% trans "Отправить ссылку" %}</button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-100 text-center">
            <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline text-sm">{% trans "← Вернуться ко входу" %}</a>
        </div>
    </div>
</div>
{% endblock %}
