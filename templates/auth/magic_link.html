{% extends 'base.html' %}
{% load static i18n %}

{% block content %}
<div class="fade-in" style="display: flex; flex-direction: column; align-items: center; padding: 24px 0">
    <div class="auth-card">
        <div class="auth-top">
            <a href="{% url 'home' %}"><img class="m" src="{% static 'img/logo-icon.png' %}" alt="StudyAI"></a>
        </div>

        <h2 class="auth-h">{% trans "Вход по ссылке" %}</h2>
        <p class="auth-sub" style="margin-bottom: 22px">{% trans "Мы отправим вам одноразовую ссылку для входа на почту." %}</p>

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="alex@mail.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px">
                <i data-lucide="send" class="w-4 h-4"></i>{% trans "Отправить ссылку" %}
            </button>
        </form>
    </div>

    <a href="{% url 'login' %}" class="iconbtn auth-back"><i data-lucide="arrow-left" class="w-4 h-4"></i>{% trans "Вернуться ко входу" %}</a>
</div>
{% endblock %}
